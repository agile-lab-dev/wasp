censor:
  stage: censor
  interruptible: true
  image: "registry.gitlab.com/agilefactory/developers/censor:0.1.0"
  only: [merge_requests]
  script:
    - ./censor.sh

scalafmt:
  stage: censor
  image: "registry.gitlab.com/agilefactory/agile.wasp2/sbt:1.10.7-17.0.13_11-jdk-jammy"
  interruptible: true
  script:
    - ./run-sbt-unprivileged.sh "scalafmtCheck"
  tags:
    - saas-linux-medium-arm64
  only: [merge_requests]
  needs: []

generate-open-api:
  stage: test
  interruptible: true
  image: "registry.gitlab.com/agilefactory/agile.wasp2/sbt:1.10.7-17.0.13_11-jdk-jammy"
  script:
    - ./run-sbt-unprivileged.sh "generateOpenApi"
  tags:
    - saas-linux-small-arm64
  only:
    - /^develop$/
    - /(^release\/v([0-9]+)\.([0-9]+))/
    - merge_requests
    - tags
  artifacts:
    paths: ['documentation/wasp-openapi.yaml']
  needs: []


waspctl:
  interruptible: true
  stage: deploy
  image: "registry.gitlab.com/agilefactory/agile.wasp2/waspctl-build:0.3.0"
  script:
    - bash waspctl/build-for-all-archs.bash
  artifacts:
    paths: ['waspctl/output']
  only:
    - /^develop$/
    - /(^release\/v([0-9]+)\.([0-9]+))/
    - tags
  needs:
    - generate-open-api
  dependencies:
    - generate-open-api

snapshot:
  interruptible: false
  stage: deploy
  image: "registry.gitlab.com/agilefactory/agile.wasp2/sbt:1.10.7-17.0.13_11-jdk-jammy"
  parallel:
    matrix:
      - WASP_FLAVOR: ["SPARK3.5", "SPARK3.4", "SPARK3.3"]
  tags:
    - saas-linux-medium-arm64
  script:
    - "mkdir -p $HOME/.sbt/gpg"
    - "echo $GPG_PUB | base64 -d > $HOME/.sbt/gpg/pubring.asc"
    - "echo $GPG_PRIV | base64 -d >  $HOME/.sbt/gpg/secring.asc"
    - "export PGP_PASSPHRASE=`echo $GPG_PASSPHRASE_BASE64 | base64 -d`"
    - sbt clean publishSigned
  only:
    - /^develop$/
    - /(^release\/v([0-9]+)\.([0-9]+))/
    - merge_requests
  needs:
    - test-kernel
    - test-repo
    - test-plugin

release:
  interruptible: false
  stage: deploy
  image: "registry.gitlab.com/agilefactory/agile.wasp2/sbt:1.10.7-17.0.13_11-jdk-jammy"
  parallel:
    matrix:
      - WASP_FLAVOR: [ "SPARK3.5", "SPARK3.4", "SPARK3.3" ]
  script:
    - "mkdir -p $HOME/.sbt/gpg"
    - "echo $GPG_PUB | base64 -d > $HOME/.sbt/gpg/pubring.asc"
    - "echo $GPG_PRIV | base64 -d >  $HOME/.sbt/gpg/secring.asc"
    - "export PGP_PASSPHRASE=`echo $GPG_PASSPHRASE_BASE64 | base64 -d`"
    - sbt clean publishSigned sonaRelease
  only:
    - tags
  tags:
    - saas-linux-medium-arm64

pages:
  image: registry.gitlab.com/publicagilefactory/handbook/node:10
  stage: deploy
  script:
    - npm install gitbook-cli -g # install gitbook
    - gitbook fetch 3.2.3 # fetch final stable version
    - gitbook install # add any requested plugins in book.json
    - | 
      if [[ $CI_COMMIT_REF_NAME == 'develop'  ]]
      then 
        rm -rf public/*
        gitbook build documentation public # build to the public path
      else 
        mkdir -p public/$CI_COMMIT_REF_NAME 
        rm -rf public/$CI_COMMIT_REF_NAME/*
        gitbook build documentation public/$CI_COMMIT_REF_NAME 
      fi
    - |
      if [[ -n "$CI_MERGE_REQUEST_IID" ]]
      then
        curl -vvvv -L -X POST --header "Private-Token: $AGILELAB_BOT" --data-urlencode "body=Your merge request has been rendered and can be reviewed at https://agilefactory.gitlab.io/Agile.Wasp2/$CI_COMMIT_REF_NAME/" https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes
      else
        true
      fi
  cache:
    key: pages
    paths:
      - node_modules/
      - public/
  artifacts:
    paths:
      - public
  only:
    refs:
    - merge_requests
    - /^develop$/
    changes:
    - documentation/*

