image: alpine

variables:
  SBT_OPTS: "-Dglobal.base=sbt-cache/sbtboot -Dsbt.boot.directory=sbt-cache/boot -Dsbt.ivy.home=sbt-cache/ivy -Divy.home=${CI_PROJECT_DIR}/sbt-cache/ivy -Dsbt.ci=true"
  COURSIER_CACHE: sbt-cache/coursier
  UNPRIVILEGED_USER: "tester"

stages:
  - censor # first censor cause it's faster
  - waspctl
  - test
  - integration
  - deploy

cache:
  key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
  paths:
    - "sbt-cache/ivy/cache"
    - "sbt-cache/boot"
    - "sbt-cache/sbtboot"
    - "sbt-cache/target"
    - "sbt-cache/coursier"
    - node_modules/
    - public/ 
      # Node modules and dependencies

test-kernel:
  stage: test
  interruptible: true
  image: "registry.gitlab.com/agilefactory/agile.wasp2/sbt:1.10.7-17.0.13_11-jdk-jammy"
  parallel:
    matrix:
      - WASP_FLAVOR: [ "SPARK3.5", "SPARK3.4", "SPARK3.3" ]
  script:
    - ./run-sbt-unprivileged.sh "clean coverage wasp-kernel/test wasp-kernel/coverageAggregate"
  after_script:
    - mkdir test-output
    - find . -path '*/test-reports/*.xml' -exec cp '{}' ./test-output/ \;
  coverage: '/Aggregation complete. Coverage was \[(\d+.\d+)\]/'
  artifacts:
    reports:
      junit: 'test-output/*.xml'
      coverage_report:
        coverage_format: cobertura
        path: 'target/scala-2.*/coverage-report/cobertura.xml'
  tags:
    - saas-linux-medium-amd64
  only:
    - /^develop$/
    - /(^release\/v([0-9]+)\.([0-9]+))/
    - merge_requests
  needs: []

