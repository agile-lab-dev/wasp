    - ./run-sbt-unprivileged.sh "clean wasp-whitelabel/test"
  tags:
    - saas-linux-medium-arm64
  only:
    - /^develop$/
    - /(^release\/v([0-9]+)\.([0-9]+))/
    - merge_requests
